                        <div class="text-xs text-app-secondary">{{ prospect.title }}</div>
                      </div>
                      <span class="text-xs px-1.5 py-0.5 rounded-full" style="background: var(--color-success-light); color: var(--color-success);">draft ready</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs">
                      <span class="font-mono text-app-muted">{{ prospect.email }}</span>
                      <span class="text-app-muted">·</span>
                      <span :style="{ color: prospect.emailConfidence > 85 ? 'var(--color-success)' : 'var(--color-warning)' }">{{ prospect.emailConfidence }}% confidence</span>
                    </div>
                    <div class="mt-2 text-xs flex items-center gap-1.5" style="color: var(--color-brand-primary);">Open draft → <span class="font-mono opacity-60">3 follow-ups pre-staged</span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- DRAFT 3-COLUMN -->
          <div v-else-if="currentView === 'draft' && selectedProspect" class="flex-1 flex view-enter overflow-hidden">
            <div class="flex-1 min-w-0 overflow-y-auto p-4 lg:p-6">
              <button @click="navigate('company', { companyId: selectedCompany.id })" class="text-xs text-app-secondary hover:text-app mb-4">← Back to {{ selectedCompany.name }}</button>
              <div v-if="selectedCompany.prospects.length > 1" class="flex gap-1 mb-4 p-1 rounded-lg bg-app-muted inline-flex">
                <button v-for="p in selectedCompany.prospects" :key="p.id" @click="navigate('draft', { companyId: selectedCompany.id, prospectId: p.id })"
                  :class="['px-3 py-1.5 rounded-md text-xs font-medium transition-colors', selectedProspectId === p.id ? 'bg-app text-app shadow-sm' : 'text-app-secondary hover:text-app']">{{ p.name }}</button>
              </div>
              <div class="mb-4">
                <h1 class="text-xl font-semibold tracking-tight text-app">Email draft for {{ selectedProspect.name }}</h1>
                <p class="text-sm text-app-secondary mt-0.5">{{ selectedProspect.title }} · {{ selectedCompany.name }}</p>
              </div>
              <div class="bg-app rounded-lg border border-app overflow-hidden mb-4">
                <div class="border-b border-app p-4 space-y-1.5">
                  <div class="flex gap-3 text-sm">
                    <span class="text-app-muted w-16 flex-shrink-0">From:</span>
                    <span class="font-mono text-app">{{ draftEmail.from }}</span>
                  </div>
                  <div class="flex gap-3 text-sm flex-wrap">
                    <span class="text-app-muted w-16 flex-shrink-0">To:</span>
                    <span class="font-mono text-app">{{ selectedProspect.email }}</span>
                    <span class="text-xs px-1.5 py-0.5 rounded font-medium" :style="{ background: selectedProspect.emailConfidence > 85 ? 'var(--color-success-light)' : 'var(--color-warning-light)', color: selectedProspect.emailConfidence > 85 ? 'var(--color-success)' : 'var(--color-warning)' }">{{ selectedProspect.emailConfidence }}% confidence</span>
                  </div>
                  <div class="flex gap-3 text-sm">
                    <span class="text-app-muted w-16 flex-shrink-0">Subject:</span>
                    <input v-model="editedDraft.subject" @input="draftEdited = true" class="flex-1 font-medium text-app bg-transparent border-0 outline-0 focus:bg-app-subtle px-1 -mx-1 rounded"/>
                  </div>
                </div>
                <textarea v-model="editedDraft.body" @input="draftEdited = true" rows="14" class="w-full p-4 text-sm leading-relaxed bg-app text-app outline-0 resize-none whitespace-pre-wrap"></textarea>
                <div class="border-t border-app p-3 flex flex-wrap items-center gap-2 bg-app-subtle">
                  <button @click="approveDraft" class="btn-primary px-4 py-1.5 rounded-md text-sm font-medium">Approve & queue send</button>
                  <button class="px-3 py-1.5 rounded-md text-sm border border-app text-app hover:bg-app-muted">Save edits</button>
                  <button @click="openRejectModal" class="px-3 py-1.5 rounded-md text-sm text-app-secondary hover:text-app">Reject draft</button>
                  <div class="flex-1"></div>
                  <span v-if="draftEdited" class="text-xs text-app-muted">Edited · saves on send</span>
                </div>
              </div>
              <div class="bg-app rounded-lg border border-app p-5">
                <div class="flex items-center justify-between mb-4">
                  <h2 class="text-sm font-semibold text-app uppercase tracking-wider">3-touch follow-up sequence</h2>
                  <span class="text-xs text-app-muted">Auto-cancels on reply</span>
                </div>
                <div class="space-y-2">
                  <div v-for="fu in draftEmail.followUps" :key="fu.day" class="rounded-md border border-app p-3 flex items-start gap-3">
                    <div class="w-8 h-8 rounded flex items-center justify-center text-xs font-semibold flex-shrink-0" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">D{{ fu.day }}</div>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-medium text-app truncate">{{ fu.subject }}</div>
                      <div class="text-xs text-app-secondary truncate">{{ fu.preview }}</div>
                    </div>
                    <button class="text-xs text-app-muted hover:text-app">Edit</button>
                  </div>
                </div>
              </div>
            </div>

            <aside class="ctx-rail flex-shrink-0 border-l border-app"
              :class="[mobileContextOpen ? 'fixed inset-y-0 right-0 z-30 w-80' : 'hidden lg:block', 'lg:w-80']"
              style="background: var(--color-bg);">
              <div class="ctx-section">
                <div class="flex items-start gap-3">
                  <div class="w-10 h-10 rounded-lg flex items-center justify-center text-white font-semibold flex-shrink-0" :style="{ background: selectedCompany.logoColor }">{{ selectedCompany.logo }}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <h3 class="text-sm font-semibold text-app">{{ selectedCompany.name }}</h3>
                      <span class="text-xs px-1.5 py-0.5 rounded border font-medium uppercase tracking-wider" :class="sizeBadgeClass(selectedCompany.size)">{{ selectedCompany.size }}</span>
                    </div>
                    <div class="text-xs text-app-secondary mt-0.5">{{ selectedCompany.industry }}</div>
                    <div class="text-xs text-app-muted mt-0.5 font-mono">{{ selectedCompany.employees }} emp · {{ selectedCompany.location }}</div>
                  </div>
                  <div class="text-right flex-shrink-0">
                    <div class="text-[10px] text-app-muted uppercase tracking-wider">Score</div>
                    <div class="text-lg font-semibold leading-none mt-0.5" :style="{ color: selectedCompany.score >= 80 ? 'var(--color-success)' : selectedCompany.score >= 70 ? 'var(--color-brand-primary)' : 'var(--color-warning)' }">{{ selectedCompany.score }}</div>
                  </div>
                </div>
                <div class="text-xs text-app-muted mt-2 font-mono">{{ selectedCompany.funding }}</div>
              </div>
              <div class="ctx-section">
                <div class="text-xs font-medium uppercase tracking-wider mb-1.5" style="color: var(--color-brand-primary);">Why this company</div>
                <p class="text-xs leading-relaxed text-app-secondary">{{ selectedCompany.rationale }}</p>
              </div>
              <div class="ctx-section">
                <div class="text-xs font-medium uppercase tracking-wider mb-3 text-app-muted">Active signals · {{ selectedCompany.signals.length }}</div>
                <div class="space-y-2.5">
                  <div v-for="signal in selectedCompany.signals" :key="signal.id" class="border-l-2 pl-2.5" :style="{ borderColor: signal.strength === 'critical' ? 'var(--color-danger)' : signal.strength === 'high' ? 'var(--color-warning)' : 'var(--color-warning-light)' }">
                    <div class="flex items-center justify-between gap-2 mb-0.5">
                      <h4 class="text-xs font-semibold text-app">{{ signal.label }}</h4>
                      <span class="text-[10px] px-1 py-px rounded font-semibold" :class="signalStrengthClass(signal.strength)">{{ signal.strength }}</span>
                    </div>
                    <p class="text-[11px] leading-snug text-app-secondary">{{ signal.evidence }}</p>
                    <div class="text-[10px] text-app-muted font-mono mt-0.5">{{ relativeDate(signal.date) }}</div>
                  </div>
                </div>
              </div>
              <div class="ctx-section">
                <div class="text-xs font-medium uppercase tracking-wider mb-3 text-app-muted">Prospect</div>
                <div class="text-sm font-semibold text-app">{{ selectedProspect.name }}</div>
                <div class="text-xs text-app-secondary">{{ selectedProspect.title }}</div>
                <div class="mt-2 space-y-1 text-xs">
                  <div class="flex gap-2">
                    <span class="text-app-muted w-14">Email:</span>
                    <span class="font-mono text-app text-[11px]">{{ selectedProspect.email }}</span>
                  </div>
                  <div class="flex gap-2">
                    <span class="text-app-muted w-14">Confidence:</span>
                    <span :style="{ color: selectedProspect.emailConfidence > 85 ? 'var(--color-success)' : 'var(--color-warning)' }">{{ selectedProspect.emailConfidence }}%</span>
                  </div>
                  <div class="flex gap-2">
                    <span class="text-app-muted w-14">LinkedIn:</span>
                    <a class="font-mono text-[11px]" style="color: var(--color-brand-primary);">/in/{{ selectedProspect.linkedin }}</a>
                  </div>
                  <div class="flex gap-2">
                    <span class="text-app-muted w-14">Function:</span>
                    <span class="text-app capitalize">{{ selectedProspect.function }}</span>
                  </div>
                </div>
              </div>
              <div class="ctx-section" style="background: var(--color-brand-primary-light);">
                <div class="text-xs font-medium uppercase tracking-wider mb-1.5" style="color: var(--color-brand-primary);">Signals used in this draft</div>
                <div class="flex flex-wrap gap-1">
                  <span v-for="s in draftEmail.signalsUsed" :key="s" class="text-[11px] px-2 py-0.5 rounded-full font-medium" style="background: var(--color-bg); color: var(--color-brand-primary);">{{ s }}</span>
                </div>
              </div>
            </aside>
          </div>
        </main>

        <div v-if="showAssignMenu" @click="showAssignMenu = null" class="fixed inset-0 z-10"></div>

        <div v-if="showRejectModal" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/50" @click.self="showRejectModal = false">
          <div class="bg-app rounded-lg shadow-lg w-full max-w-md p-6">
            <h3 class="text-lg font-semibold text-app mb-1">Why are you rejecting this draft?</h3>
            <p class="text-sm text-app-secondary mb-4">Your reason helps the agent learn what not to surface.</p>
            <div class="space-y-2 mb-4">
              <label v-for="reason in ['Wrong company', 'Wrong person at the company', 'Already approached', 'Already a customer', 'Too small for our ICP', 'Bad timing', 'Other']" :key="reason"
                class="flex items-center gap-2 p-2.5 rounded-md border cursor-pointer hover:bg-app-subtle"
                :style="rejectionReason === reason ? { borderColor: 'var(--color-brand-primary)', background: 'var(--color-brand-primary-light)' } : {}">
                <input type="radio" v-model="rejectionReason" :value="reason"/>
                <span class="text-sm text-app">{{ reason }}</span>
              </label>
            </div>
            <textarea v-if="rejectionReason === 'Other'" v-model="rejectionNote" rows="2" placeholder="Tell us more so the agent can learn..." class="w-full text-sm p-2 rounded border border-app mb-3 bg-app text-app"></textarea>
            <div class="flex gap-2 justify-end">
              <button @click="showRejectModal = false" class="px-4 py-2 text-sm text-app-secondary hover:text-app">Cancel</button>
              <button @click="submitRejection" :disabled="!rejectionReason" class="btn-primary px-4 py-2 rounded-md text-sm font-medium" :class="!rejectionReason ? 'opacity-50 cursor-not-allowed' : ''">Submit rejection</button>
            </div>
          </div>
        </div>

        <div v-if="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 toast-enter">
          <div class="bg-app shadow-lg rounded-lg border border-app px-4 py-3 flex items-center gap-3 text-sm">
            <div class="w-2 h-2 rounded-full" style="background: var(--color-success);"></div>
            <span class="text-app">{{ toast }}</span>
          </div>
        </div>
      </div>
      `
    };

    createApp(App).mount('#app');
  </script>
</body>
</html>
